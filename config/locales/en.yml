en:
  treaty:
    # ============================================================================
    # Attributes: Definition, validation, and processing
    # ============================================================================
    attributes:
      # Attribute value validators
      validators:
        required:
          blank: "Attribute '%{attribute}' is required but was not provided or is empty"

        type:
          unknown_type: "Unknown type '%{type}' for attribute '%{attribute}'. Allowed types: %{allowed}"
          mismatch:
            integer: "Attribute '%{attribute}' must be an Integer, got %{actual}"
            string: "Attribute '%{attribute}' must be a String, got %{actual}"
            boolean: "Attribute '%{attribute}' must be a Boolean (true or false), got %{actual}"
            object: "Attribute '%{attribute}' must be a Hash (object), got %{actual}"
            array: "Attribute '%{attribute}' must be an Array, got %{actual}"
            date: "Attribute '%{attribute}' must be a Date, got %{actual}"
            time: "Attribute '%{attribute}' must be a Time, got %{actual}"
            datetime: "Attribute '%{attribute}' must be a DateTime, got %{actual}"

        inclusion:
          invalid_schema: "Option 'inclusion' for attribute '%{attribute}' must have a non-empty array of allowed values"
          not_included: "Attribute '%{attribute}' must be one of: %{allowed}. Got: '%{value}'"

        format:
          type_mismatch: "Option 'format' for attribute '%{attribute}' can only be used with String type. Current type: %{type}"
          unknown_format: "Unknown format '%{format_name}' for attribute '%{attribute}'. Allowed formats: %{allowed}"
          mismatch: "Attribute '%{attribute}' has invalid %{format_name} format: '%{value}'"

        # Nested structures validation
        nested:
          # Orchestrator errors
          orchestrator:
            collection_not_implemented: "Subclass must implement the collection_of_attributes method"

          # Array validation errors
          array:
            element_validation_error: "Error in array '%{attribute}' at index %{index}: Element must match one of the defined types. Errors: %{errors}"
            element_type_error: "Error in array '%{attribute}' at index %{index}: Expected Hash but got %{actual}"
            attribute_error: "Error in array '%{attribute}' at index %{index}: %{message}"

      # Attribute options
      options:
        unknown: "Unknown options for attribute '%{attribute}': %{unknown}. Known options: %{known}"
        message_evaluation_error: "Custom message evaluation failed for attribute '%{attribute}': %{error}"

      # Attribute modifiers
      modifiers:
        as:
          invalid_type: "Option 'as' for attribute '%{attribute}' must be a Symbol. Got: %{type}"

        transform:
          invalid_type: "Option 'transform' for attribute '%{attribute}' must be a Proc or Lambda. Got: %{type}"
          execution_error: "Transform failed for attribute '%{attribute}': %{error}"

        computed:
          invalid_type: "Option 'computed' for attribute '%{attribute}' must be a Proc or Lambda. Got: %{type}"
          execution_error: "Computed failed for attribute '%{attribute}': %{error}"

        cast:
          invalid_type: "Option 'cast' for attribute '%{attribute}' must be a Symbol. Got: %{type}"
          source_not_supported: "Option 'cast' for attribute '%{attribute}' cannot be used with type '%{source_type}'. Casting is only supported for: %{allowed}"
          target_not_supported: "Option 'cast' for attribute '%{attribute}' cannot cast to '%{target_type}'. Supported target types: %{allowed}"
          conversion_not_supported: "Option 'cast' for attribute '%{attribute}' does not support conversion from '%{from}' to '%{to}'"
          conversion_error: "Cast failed for attribute '%{attribute}' from '%{from}' to '%{to}'. Value: '%{value}'. Error: %{error}"

      # Attribute conditionals
      conditionals:
        if:
          invalid_type: "Option 'if' for attribute '%{attribute}' must be a Proc or Lambda. Got: %{type}"
          evaluation_error: "Conditional evaluation failed for attribute '%{attribute}': %{error}"

        unless:
          invalid_type: "Option 'unless' for attribute '%{attribute}' must be a Proc or Lambda. Got: %{type}"
          evaluation_error: "Conditional evaluation failed for attribute '%{attribute}': %{error}"

        mutual_exclusivity_error: "Attribute '%{attribute}' cannot have both 'if' and 'unless' options. Use only one conditional option."

      # Attribute builder DSL
      builder:
        not_implemented: "%{class} must implement #create_attribute"
        create_attribute_not_implemented: "Subclass %{class} must implement #create_attribute method"
        deep_copy_not_implemented: "%{class} must implement #deep_copy_attribute"
        invalid_entity_class: "use_entity expects a Treaty::Entity subclass, got %{type}: %{value}"
        use_entity_after_attributes: "use_entity must be the only statement in the block. Cannot call use_entity after defining other attributes."
        attributes_after_use_entity: "use_entity must be the only statement in the block. Cannot define attributes after calling use_entity."

      # Attribute-level errors
      errors:
        nesting_level_exceeded: "Nesting level %{level} exceeds maximum allowed level of %{max_level}"
        apply_defaults_not_implemented: "%{class} must implement #apply_defaults!"
        process_nested_not_implemented: "%{class} must implement #process_nested_attributes"

    # ============================================================================
    # Request: Request definition and structure
    # ============================================================================
    request:
      # Request factory DSL
      factory:
        unknown_method: "Unknown method '%{method}' in request definition. Use 'object :name do ... end' to define request structure"
        invalid_entity_class: "Request expects a Treaty::Entity subclass, got %{type}: %{value}"

    # ============================================================================
    # Response: Response definition and structure
    # ============================================================================
    response:
      # Response factory DSL
      factory:
        unknown_method: "Unknown method '%{method}' in response definition. Use 'object :name do ... end' to define response structure"
        invalid_entity_class: "Response expects a Treaty::Entity subclass, got %{type}: %{value}"

    # ============================================================================
    # Versioning: API version management and resolution
    # ============================================================================
    versioning:
      # Version resolver
      resolver:
        specified_version_required: "Specified version is required for validation"
        version_not_found: "Version %{version} not found in treaty definition"
        version_deprecated: "Version %{version} is deprecated and cannot be used"

      # Version factory
      factory:
        invalid_default_option: "Default option for version must be true, false, or a Proc, got: %{type}"
        unknown_method: "Unknown method '%{method}' in version definition. Available methods: summary, deprecated, request, response, delegate_to"
        default_deprecated_conflict: "Version %{version} cannot be both default and deprecated. A default version must be active and usable. Either remove 'default: true' or remove the 'deprecated' declaration."
        multiple_defaults: "Cannot have multiple versions marked as default. Only one version can be the default. Please review your treaty definition and ensure only one version has 'default: true'."

    # ============================================================================
    # Execution: Service and executor invocation
    # ============================================================================
    execution:
      executor_missing: "Executor is not defined for version %{version}"
      executor_empty: "Executor cannot be an empty string"
      executor_not_found: "Executor class `%{class_name}` not found"
      executor_invalid_type: "Invalid executor type: %{type}. Expected Proc, Class, String, or Symbol"
      method_not_found: "Method '%{method}' not found in class '%{class_name}'"
      proc_error: "%{message}"
      servactory_input_error: "%{message}"
      servactory_internal_error: "%{message}"
      servactory_output_error: "%{message}"
      servactory_failure_error: "%{message}"
      regular_service_error: "%{message}"

    # ============================================================================
    # Controller DSL: Rails controller integration
    # ============================================================================
    controller:
      treaty_class_not_found: "%{class_name}"

    # ============================================================================
    # Inventory: Controller data provisioning system
    # ============================================================================
    inventory:
      # Factory DSL errors
      unknown_method: "Unknown method '%{method}' in treaty block for action '%{action}'. Only 'provide' method is supported. Use: provide :name, from: :source OR provide :name"
      name_must_be_symbol: "Inventory name must be a Symbol, got %{name}. Use: provide :name, from: :source OR provide :name"

      # Inventory validation errors
      invalid_name: "Inventory name must be a non-empty Symbol, got %{name}"
      source_required: "Inventory source cannot be nil. Provide a Symbol (method name), Proc/Lambda, or direct value"
      evaluation_error: "Failed to evaluate inventory item '%{name}': %{error}"

    # ============================================================================
    # Executor: Inventory executor wrapper
    # ============================================================================
    executor:
      inventory:
        item_not_found: "Inventory item '%{name}' not found. Available items: %{available}"
